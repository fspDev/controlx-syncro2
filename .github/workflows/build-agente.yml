name: Build Agente EXE

on:
  push:
    branches: [main]
    paths:
      - 'agente-local.cjs'
      - '.github/workflows/build-agente.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Build exe (64-bit)
        run: pkg agente-local.cjs --target node18-win-x64 --output agente-controlx-x64.exe

      - name: Build exe (32-bit)
        # No bloquea el job si falla: @yao-pkg/pkg puede no tener un binario base
        # pre-compilado para win-x86 disponible. Si falla, al menos se publica x64.
        continue-on-error: true
        run: pkg agente-local.cjs --target node18-win-x86 --output agente-controlx-x86.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agente-controlx
          path: agente-controlx-x*.exe
          if-no-files-found: warn
          retention-days: 90

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agente-latest
          name: Agente Control X (última versión)
          body: |
            ## Agente Central de Red — Control X Syncro

            Descargá el `.exe` correcto para el SERVIDOR donde lo vas a correr y ejecutalo ahí.
            No requiere Node.js instalado.

            **¿Cuál descargar?**
            - La mayoría de los Windows actuales son de 64 bits → usá `agente-controlx-x64.exe`
            - Si el servidor es viejo o tiene Windows de 32 bits → usá `agente-controlx-x86.exe`
            - Para verificar: en el servidor, ir a Configuración → Sistema → Acerca de → "Tipo de sistema". Si dice "sistema operativo de 32 bits", usá la versión x86.

            **Instrucciones:**
            1. Copiá el `.exe` correcto al servidor
            2. Doble clic para ejecutarlo (o como servicio de Windows)
            3. Anotá la URL que muestra en consola (ej: `http://192.168.1.10:3001`)
            4. Configurá esa URL en la app: **Admin → Agente de Red**
          files: agente-controlx-x*.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
