name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install en vez de npm ci: package-lock.json puede no estar
        # perfectamente sincronizado tras agregar dependencias manualmente
        # sin poder correr npm localmente. npm install lo resuelve y
        # actualiza el lockfile en este entorno (no se commitea de vuelta).
        # --legacy-peer-deps: evita que un conflicto de peerDependencies
        # (ej. vite-plugin-pwa sin rango declarado para una versión de
        # Vite muy reciente) bloquee la instalación.
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
