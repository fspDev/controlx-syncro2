<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/controlx-syncro2/favicon.ico" />
    <link rel="manifest" href="/controlx-syncro2/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <link rel="apple-touch-icon" href="/controlx-syncro2/pwa-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control X Syncro</title>
    <!-- GitHub Pages SPA routing: restore path from 404.html redirect -->
    <script>
      (function(l){
        if(l.search[1]==='/'){
          var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');
          window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
